name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libpipewire-0.3-dev libxkbcommon-dev xvfb dbus
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: dbus-run-session -- xvfb-run -a cargo test --workspace
      - name: Verify the agent systemd unit
        run: |
          cargo build -p timereel-agent
          sudo install -m 755 target/debug/timereel-agent /usr/bin/timereel-agent
          systemd-analyze --user verify packaging/timereel-agent.service
          sudo rm /usr/bin/timereel-agent
      - name: Check the GNOME extension JavaScript
        run: |
          node --version
          node --check --input-type=module < "extras/gnome-shell-extension/timereel-focus@timereel.org/extension.js"
      - name: Cargo deny
        run: cargo deny check
