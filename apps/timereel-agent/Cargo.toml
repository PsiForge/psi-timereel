[package]
name = "timereel-agent"
description = "TimeReel timereel-agent binary"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
timereel-capture = { path = "../../crates/timereel-capture" }
timereel-config = { path = "../../crates/timereel-config" }
timereel-crypto = { path = "../../crates/timereel-crypto" }
timereel-image = { path = "../../crates/timereel-image" }
timereel-store = { path = "../../crates/timereel-store" }
tracing = "0.1"

[dev-dependencies]
age = "0.11.2"
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
