[package]
name = "timereel"
description = "Private, encrypted screenshot timeline"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
timereel-config = { path = "../../crates/timereel-config" }
timereel-crypto = { path = "../../crates/timereel-crypto" }
# Settings: the retention count for the confirmation (T07).
timereel-store = { path = "../../crates/timereel-store" }
# The desktop lock-state source (T12), for lock-on-session-lock.
timereel-capture = { path = "../../crates/timereel-capture" }
# The timeline view (T20): index, loader, caches, strip layout, labels.
timereel-timeline = { path = "../../crates/timereel-timeline" }
# Decoded pictures (`RgbaImage`) for the timeline textures.
timereel-image = { path = "../../crates/timereel-image" }
futures-util = { version = "0.3", default-features = false }
# GUI (ADR 0002): glow backend; `persistence` stays off so no UI state is written.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
# Single instance over the session bus (`org.timereel.Viewer1`). Blocking API: no async runtime needed.
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread"] }
thiserror = "2.0.21"
egui = { version = "0.37", default-features = false }
zeroize = "1"
libc = "0.2"

[dev-dependencies]
egui_kittest = "0.37"
tempfile = "3.27.0"

# .deb (ADR 0012): `cargo build --release --workspace && cargo deb -p timereel --no-build`.
# One package holds all three programs. There are no maintainer scripts: nothing
# starts a service when the package is installed.
[package.metadata.deb]
name = "timereel"
maintainer = "TimeReel contributors <noreply@timereel.org>"
copyright = "TimeReel contributors"
changelog = "../../packaging/changelog"
section = "utils"
priority = "optional"
extended-description = """\
TimeReel takes a small screenshot every few minutes, encrypts it in memory and \
stores it under your home directory. A viewer lets you unlock the data and \
scroll back through the day. There is no network access, no server and no \
account, and no program runs as root.
.
The capture agent is a systemd user service that the first-run set-up enables.
To delete all TimeReel data, run `timereel purge-data` before removing the package."""
# $auto adds the libraries the binaries link against (for example libpipewire-0.3-0).
# The others are loaded at run time by the window system and graphics code.
depends = "$auto, systemd, libpipewire-0.3-0t64 | libpipewire-0.3-0, libxkbcommon-x11-0, libgl1"
recommends = "xdg-desktop-portal, gnome-shell-extension-appindicator"
assets = [
    ["target/release/timereel", "usr/bin/", "755"],
    ["target/release/timereel-agent", "usr/bin/", "755"],
    ["target/release/timereel-tray", "usr/bin/", "755"],
    ["../../packaging/timereel-agent.service", "usr/lib/systemd/user/", "644"],
    ["../../packaging/timereel-tray.desktop", "etc/xdg/autostart/", "644"],
    ["../../packaging/timereel.desktop", "usr/share/applications/", "644"],
    ["../../packaging/icons/timereel.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../extras/gnome-shell-extension/timereel-focus@timereel.org/extension.js", "usr/share/gnome-shell/extensions/timereel-focus@timereel.org/", "644"],
    ["../../extras/gnome-shell-extension/timereel-focus@timereel.org/metadata.json", "usr/share/gnome-shell/extensions/timereel-focus@timereel.org/", "644"],
]
