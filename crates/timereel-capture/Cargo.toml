[package]
name = "timereel-capture"
description = "TimeReel capture sources: screen, active window and lock traits, with fakes for tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = "2.0.21"
timereel-image = { path = "../timereel-image" }
x11rb = { version = "0.14", default-features = false, features = ["randr"] }
tracing = "0.1"
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync"] }
zbus = { version = "6", default-features = false, features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
x11rb = { version = "0.14", default-features = false, features = ["randr"] }
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync", "macros"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
