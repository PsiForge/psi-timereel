[package]
name = "timereel-crypto"
description = "TimeReel crypto: key file with password and recovery slots"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
age = "0.11.2"
argon2 = "0.6.0"
base64 = "0.23.1"
bech32 = "0.12.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
