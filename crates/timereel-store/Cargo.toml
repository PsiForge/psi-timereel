[package]
name = "timereel-store"
description = "TimeReel store: encrypted capture files, atomic writes and time listing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
age = "0.11.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
timereel-config = { path = "../timereel-config" }
timereel-crypto = { path = "../timereel-crypto" }

[dev-dependencies]
notify = "8"
tempfile = "3.27.0"
