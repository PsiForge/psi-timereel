[advisories]
version = 2
yanked = "deny"
# Both are "unmaintained" notices (not vulnerabilities) for proc-macro crates
# that `age` pulls in only for its translated messages (i18n-embed). They run
# at build time and are not linked into any TimeReel binary.
ignore = [
  { id = "RUSTSEC-2026-0374", reason = "basic-toml: build-time proc-macro via age's i18n-embed" },
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2: build-time proc-macro via age's i18n-embed" },
  # ksni (ADR 0003) is built on zbus 5, whose helper crates were merged into zbus 6.
  # These are "unmaintained" notices, not vulnerabilities; the fix is a ksni release on zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5.x via ksni's zbus 5; zbus 6 (used by the rest of TimeReel) has it built in" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.x via ksni's zbus 5; zbus 6 has it built in" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.x via ksni's zbus 5; zbus 6 has it built in" },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0",
  "Unlicense", # ksni (ADR 0003): public-domain dedication, no conditions
  "IJG", # jpeg-encoder (ADR 0011): permissive, BSD-style Independent JPEG Group licence
]
# The fonts that egui (ADR 0002) embeds for its default text. Only this crate, only these licences.
exceptions = [
  { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates refer to each other by path without a version; still deny wildcards from registries.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
